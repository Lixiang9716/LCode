name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Cancel in-progress runs for the same branch/PR to avoid wasted builds
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full checks on stable: build + test + clippy + fmt + doc
  build:
    name: Build (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Key is derived from Cargo.lock + toolchain; only rebuild
          # when either changes
          shared-key: stable-full
          # Save cache even if the job fails, so retries are fast
          cache-on-failure: true
          workspaces: . -> target
      - name: Build
        run: cargo build --all-features
      - name: Run tests
        run: cargo test --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Doc build
        run: cargo doc --no-deps --all-features

  # MSRV compatibility: compile-only check on the minimum supported version
  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.94
          cache-on-failure: true
          workspaces: . -> target
      - name: Build
        run: cargo build --all-features
