# cargo-nextest configuration
# Docs: https://nexte.st/docs/configuration/

[profile.default]
# Flag tests that take longer than this as slow
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
# Retry flaky tests once before failing
retries = 1
# Run all tests even if some fail (maximizes CI signal)
fail-fast = false
# Hard per-test timeout
timeout = "120s"

[test-groups.integration]
# Run integration tests with limited concurrency
max-threads = 2
