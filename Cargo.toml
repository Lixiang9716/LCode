[package]
name = "lcode"
version = "0.1.0"
edition = "2021"
description = "LCode - A powerful CLI code agent for autonomous software development"
authors = ["Lixiang9716"]
license = "MIT"
repository = "https://github.com/Lixiang9716/LCode"
readme = "README.md"

[[bin]]
name = "lcode"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for LLM API calls
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Interactive REPL
rustyline = "15"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "0.8"
dirs = "6"

# Async trait support
async-trait = "0.1"

# UUID generation for session IDs
uuid = { version = "1", features = ["v4"] }

# Streaming support for LLM responses
futures = "0.3"
tokio-stream = "0.1"

# Token counting (approximate)
tiktoken-rs = "0.12"

# File system walker for search tools
walkdir = "2"

# Glob pattern matching
glob = "0.3"

# Lightweight regex for built-in grep
regex-lite = "0.1"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
tokio-test = "0.4"
mockall = "0.13"
rstest = "0.22"
serial_test = "3"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
