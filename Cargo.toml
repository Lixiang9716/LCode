[package]
name = "lcode"
version = "0.11.0"
edition = "2021"
rust-version = "1.94"
description = "LCode - A powerful CLI code agent for autonomous software development"
authors = ["Lixiang9716"]
license = "MIT"
repository = "https://github.com/Lixiang9716/LCode"
readme = "README.md"

[[bin]]
name = "lcode"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for LLM API calls
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Interactive REPL
rustyline = "15"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "0.8"
dirs = "6"

# Async trait support
async-trait = "0.1"

# UUID generation for session IDs
uuid = { version = "1", features = ["v4"] }

# Streaming support for LLM responses
futures = "0.3"
tokio-stream = "0.1"

# Exact token counting (tiktoken cl100k_base BPE tokenizer)
tiktoken-rs = "0.6"

# Self-update (lcode update): tar.gz extraction
flate2 = "1"
tar = "0.4"

# File system walker for search tools
walkdir = "2"

# Glob pattern matching
glob = "0.3"

# Lightweight regex for built-in grep
regex-lite = "0.1"

# Mocking for the LlmProvider trait (used by tests/unit_agent.rs; the
# automock is compiled unconditionally so integration tests can use it)
mockall = "0.13"
secrecy = { version = "0.10.3", features = ["serde"] }
sha2 = "0.11.0"
hex = "0.4.3"
landlock = "0.4.7"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
tokio-test = "0.4"
rstest = "0.22"
serial_test = "4"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

